# MultiPersonal Chat System - Docker Compose（2x3090 各~15G可用显存）
# 适配策略：单 vLLM 实例 + AWQ 4bit 量化模型



volumes:
  models:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/models
  loras:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/loras
  data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/app
  nginx_logs:


services:
  # ============================================
  # vLLM 推理服务（单实例 + AWQ量化，GPU 0）
  # 显存占用：模型 ~4.5G + KV Cache ~3G = ~7.5G（15G内充足）
  # ============================================
  vllm:
    image: vllm/vllm-openai:v0.10.2
    container_name: multipersonal-vllm
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - models:/models:ro
      - loras:/loras:ro
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - VLLM_ALLOW_RUNTIME_LORA_UPDATING=True
    command: >
      --model /models/Qwen3-8B-Instruct-AWQ
      --served-model-name qwen3-8b-instruct-awq
      --quantization awq_marlin
      --enable-lora
      --max-loras 4
      --max-lora-rank 64
      --gpu-memory-utilization 0.5
      --max-model-len ${VLLM_MAX_MODEL_LEN:-24576}
      --max-num-seqs ${VLLM_MAX_NUM_SEQS:-4}
      --dtype float16
      --tensor-parallel-size 1
      --host 0.0.0.0
      --port 8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=8)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - multipersonal-net

  # ============================================
  # FastAPI 后端
  # ============================================
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        INSTALL_GPU_DEPS: "false"
    container_name: multipersonal-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - data:/app/data
      - loras:/app/loras
      - models:/app/models:ro
      - ../backend/data/knowledge/tsukiyashiro_kisaki/character_knowledge_index_v3:/app/character_knowledge_index:ro
    environment:
      - VLLM_ENABLED=true
      - MODEL_PROVIDER=vllm
      - VLLM_BASE_URLS=http://vllm:8000
      - VLLM_SERVED_MODEL_NAME=qwen3-8b-instruct-awq
      # The shared loras volume is /app/loras here and /loras in vLLM.
      - VLLM_LORA_ROOT=/loras
      - BACKEND_WORKERS=1
      - BACKEND_LIMIT_CONCURRENCY=${BACKEND_LIMIT_CONCURRENCY:-256}
      - BACKEND_BACKLOG=${BACKEND_BACKLOG:-512}
      - BACKEND_KEEPALIVE_TIMEOUT=${BACKEND_KEEPALIVE_TIMEOUT:-10}
      - STATS_CACHE_TTL_SECONDS=${STATS_CACHE_TTL_SECONDS:-5}
      - STATS_RESOURCE_CACHE_TTL_SECONDS=${STATS_RESOURCE_CACHE_TTL_SECONDS:-15}
      - AUTH_PASSWORD_WORKERS=${AUTH_PASSWORD_WORKERS:-2}
      - AUTH_PASSWORD_MAX_PENDING=${AUTH_PASSWORD_MAX_PENDING:-8}
      - AUTH_PASSWORD_TIMEOUT_SECONDS=${AUTH_PASSWORD_TIMEOUT_SECONDS:-10}
      - AUTH_DATABASE_WORKERS=${AUTH_DATABASE_WORKERS:-8}
      - AUTH_DATABASE_MAX_PENDING=${AUTH_DATABASE_MAX_PENDING:-32}
      - AUTH_DATABASE_TIMEOUT_SECONDS=${AUTH_DATABASE_TIMEOUT_SECONDS:-5}
      - AUTH_RPM=${BACKEND_PROXY_AUTH_AGGREGATE_RPM:-10000}
      - RATE_LIMIT_MAX_KEYS=${RATE_LIMIT_MAX_KEYS:-10000}
      - RATE_LIMIT_CLEANUP_INTERVAL=${RATE_LIMIT_CLEANUP_INTERVAL:-64}
      - RATE_LIMIT_CLEANUP_BATCH_SIZE=${RATE_LIMIT_CLEANUP_BATCH_SIZE:-64}
      - TRAINING_EXPORT_MAX_CONCURRENCY=${TRAINING_EXPORT_MAX_CONCURRENCY:-2}
      - TRAINING_EXPORT_ACQUIRE_TIMEOUT=${TRAINING_EXPORT_ACQUIRE_TIMEOUT:-1}
      - VLLM_TIMEOUT=120
      - VLLM_MAX_RETRIES=3
      - DATABASE_PATH=/app/data/qq_assistant.db
      - VECTOR_DB_PATH=/app/data/vector_db
      - CHARACTER_RAG_INDEX_ROOT=/app/character_knowledge_index
      - CHARACTER_RAG_ABSTAIN_THRESHOLD=${CHARACTER_RAG_ABSTAIN_THRESHOLD:-0.25}
      - LORA_PATH=/app/loras
      - MODEL_PATH=/app/models
      - LOG_LEVEL=INFO
      - ALLOWED_ORIGINS=http://localhost:5000,http://localhost:80
    depends_on:
      vllm:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=8)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - multipersonal-net

  # ============================================
  # Next.js 前端
  # ============================================
  frontend:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=/api
    container_name: multipersonal-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - BACKEND_URL=http://backend:8000
      - PORT=5000
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - multipersonal-net

  # ============================================
  # Nginx 反向代理
  # ============================================
  nginx:
    image: nginx:1.25-alpine
    container_name: multipersonal-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - vllm
      - backend
      - frontend
    networks:
      - multipersonal-net

networks:
  multipersonal-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
